name: VUA Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: VUA / 100% Coverage / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Coverage 100%
        run: npm run coverage

      - name: Anti-mock production gate
        run: npm run antimock

      - name: VUA Verify
        run: npm run vua:verify

      - name: Build
        run: npm run build

      - name: Upload coverage and VUA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mex-vua-quality-evidence
          path: |
            coverage/
            artifacts/

  k6:
    name: VUA / k6 Smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Start deterministic API contract stub
        run: |
          node tests/k6/mock-api.mjs > /tmp/mex-api.log 2>&1 &
          echo $! > /tmp/mex-api.pid

      - name: Wait for API stub
        run: |
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          cat /tmp/mex-api.log
          exit 1

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: k6 smoke
        env:
          API_BASE_URL: http://127.0.0.1:8000
          K6_VUS: 5
          K6_DURATION: 20s
        run: k6 run k6/smoke.js

      - name: API stub log
        if: always()
        run: cat /tmp/mex-api.log

  delivery-state:
    name: VUA / Update delivery timeline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, k6]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-delivery-state.mjs
      - name: Commit timeline
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "vua-bot"
          git config user.email "vua-bot@users.noreply.github.com"
          git add docs/BACKLOG.md docs/ROADMAP.md
          git commit -m "chore(vua): update delivery timeline [skip ci]"
          git push
